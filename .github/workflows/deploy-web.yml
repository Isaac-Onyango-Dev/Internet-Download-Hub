name: Deploy GitHub Pages

# Deploys the static docs/ site as-is: docs/index.html (the marketing/
# download landing page) and docs/web/ (a redirect stub pointing to the
# canonical web app at internet-download-hub.onrender.com — GitHub Pages
# no longer hosts a rebuilt copy of the SPA; Render is the single source
# of truth for the live web app).
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment can run at a time; this is the only workflow
# that targets the github-pages environment, so there is no cross-workflow
# race to guard against.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The three Pages actions are a coordinated set and are upgraded together.
      # configure-pages v6 / upload-pages-artifact v5 / deploy-pages v5 are
      # available but were not adopted here because the major bumps could not be
      # validated locally; this generation works and Pages deploys are live.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
