name: Test Build (Windows)

# Builds an installer from a work branch so a change can be tried on a real
# PC before it is released. Nothing is published: no tag, no GitHub Release,
# no latest.yml. The installer is attached to the run as an artifact.
on:
  push:
    branches:
      - 'claude/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the running build pointless.
concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download binaries
        run: npm run setup:binaries

      - name: Verify binaries exist
        shell: pwsh
        run: |
          $engines = @("ffmpeg.exe", "ffprobe.exe", "yt-dlp.exe", "gallery-dl.exe", "streamlink/bin/streamlink.exe", "N_m3u8DL-RE.exe")
          foreach ($engine in $engines) {
            if (!(Test-Path "binaries/$engine")) { throw "Critical Error: $engine is missing after setup. Build aborted!" }
            Write-Host "Verified: $engine"
          }

      - name: Generate icons
        run: npm run generate:icons

      - name: Build Vite frontend
        run: npx vite build

      - name: Build Electron main and preload bundles
        run: npm run build:electron

      # A pre-release version above the current release: the in-app updater
      # will not offer to "update" the tester back to the last release, the
      # About section shows exactly which build is installed, and the next
      # real release still installs over it as a normal upgrade.
      - name: Build Windows installer
        shell: bash
        run: >
          npx electron-builder build --win --publish never
          -c.extraMetadata.version=1.3.3-test.${{ github.run_number }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Internet-Download-Hub-Setup-test-${{ github.run_number }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
