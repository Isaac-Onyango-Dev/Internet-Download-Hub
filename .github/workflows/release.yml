name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Two tags pushed in quick succession must not race on the same GitHub Release.
# cancel-in-progress stays false: cancelling mid-upload would leave a release
# with a partial set of assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}."
            exit 1
          fi
          echo "Tag and package.json agree on ${PKG}."

      - name: Install dependencies
        run: npm ci

      - name: Download binaries
        run: npm run setup:binaries

      - name: Verify binaries exist
        shell: pwsh
        run: |
          $engines = @("ffmpeg.exe", "ffprobe.exe", "yt-dlp.exe", "gallery-dl.exe", "streamlink.exe", "N_m3u8DL-RE.exe")
          foreach ($engine in $engines) {
            if (!(Test-Path "binaries/$engine")) { throw "Critical Error: $engine is missing after setup. Build aborted!" }
            Write-Host "Verified: $engine"
          }
          Write-Host "All download engines successfully verified."

      - name: Generate icons
        run: npm run generate:icons

      - name: Build Vite frontend
        run: npx vite build

      - name: Build Electron main and preload bundles
        run: npm run build:electron

      # --publish never: action-gh-release below is the single publisher.
      - name: Build Windows installer
        run: npx electron-builder build --win --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
          # A build that produced no installer must fail, not publish an empty release.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
