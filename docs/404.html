    <div class="lost-row">
      <a class="btn-hot" href="/Internet-Download-Hub/">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>

  </div>
</main>
