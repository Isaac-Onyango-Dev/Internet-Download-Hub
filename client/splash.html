<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Internet Download Hub</title>

    <!--
      This window opens before the Vite bundle exists, so it cannot import
      from the app's CSS graph. It links the shared token file directly
      instead, which electron-builder ships alongside this file (see the
      `files` list in package.json). Every colour, radius and easing below
      therefore comes from client/brand.css, same as the rest of the app.
    -->
    <link rel="stylesheet" href="brand.css" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--brand-ink);
        color: var(--brand-text);
        font-family: var(--brand-body);
        -webkit-font-smoothing: antialiased;
      }

      /* The prism reads as a glow against the near-black canvas, never as a
         full-bleed wash. Same rule the site follows. */
      .glow {
        position: fixed;
        border-radius: 58% 42% 37% 63% / 46% 55% 45% 54%;
        filter: blur(70px);
        pointer-events: none;
      }
      .glow-a {
        width: 260px;
        height: 220px;
        background: var(--brand-magenta);
        opacity: 0.26;
        top: -70px;
        left: -60px;
      }
      .glow-b {
        width: 240px;
        height: 260px;
        background: var(--brand-cyan);
        opacity: 0.18;
        bottom: -90px;
        right: -60px;
      }

      .stage {
        position: relative;
        text-align: center;
        animation: rise 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .mark {
        width: 76px;
        height: 76px;
        margin: 0 auto 22px;
        filter: drop-shadow(0 12px 28px rgba(139, 47, 224, 0.55));
        animation: bob 3.2s ease-in-out infinite;
      }

      .kicker {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--brand-text-faint);
        margin-bottom: 5px;
      }

      .name {
        font-family: var(--brand-display);
        font-weight: 800;
        font-size: 26px;
        letter-spacing: -0.035em;
        line-height: 1;
        background: var(--brand-prism);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* The wordmark's custom letterform: the "o" is a play-button notch. */
      .o {
        display: inline-block;
        width: 0.64em;
        height: 0.64em;
        border-radius: 50%;
        background: var(--brand-prism);
        position: relative;
        vertical-align: -0.03em;
        margin: 0 0.035em;
      }
      .o::after {
        content: '';
        position: absolute;
        inset: 0;
        margin: auto;
        width: 0;
        height: 0;
        border-left: 0.21em solid var(--brand-ink);
        border-top: 0.125em solid transparent;
        border-bottom: 0.125em solid transparent;
        transform: translateX(0.04em);
      }

      .tagline {
        margin: 14px 0 26px;
        font-size: 13px;
        color: var(--brand-text-dim);
      }

      /* An indeterminate prism sweep rather than a spinner, so the loading
         state carries the palette too. */
      .track {
        width: 190px;
        height: 4px;
        margin: 0 auto;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }
      .track i {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: 999px;
        background: var(--brand-prism);
        animation: sweep 1.25s var(--brand-ease) infinite;
      }

      .status {
        margin-top: 14px;
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--brand-text-faint);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }
      @keyframes bob {
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes sweep {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(345%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .stage,
        .mark,
        .track i {
          animation: none;
        }
        .track i {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <div class="stage">
      <img class="mark" src="public/mark.svg" alt="" />
      <div class="kicker">Internet</div>
      <div class="name">D<span class="o"></span>wnload Hub</div>
      <p class="tagline">Grab any video, anywhere.</p>
      <div class="track"><i></i></div>
      <p class="status">Starting up</p>
    </div>
  </body>
</html>
